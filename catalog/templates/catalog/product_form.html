{% extends "catalog/menu.html" %}

{% block content %}
  <h1>{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} товар</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
  </form>

  <a href="{% url 'catalog:home' %}">Назад к списку</a>
{% endblock %}
